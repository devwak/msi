name: Build APK (Go AAR + Android)

on:
  workflow_dispatch:          # 手动触发
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

env:
  GO_VERSION: '1.22.x'
  JAVA_VERSION: '17'
  ANDROID_API: '35'
  ANDROID_NDK_VERSION: '26.1.10909125'   # 与 AGP 8.x 兼容的 NDK
  MIN_SDK: '24'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- Go ----------
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      # ---------- Java + Android SDK / NDK ----------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'   # 不装已废弃的 tools
    
      - name: Install Android packages (platform + NDK + build-tools)
        run: |
          sdkmanager --install \
            "platforms;android-${{ env.ANDROID_API }}" \
            "build-tools;35.0.0" \
            "ndk;${{ env.ANDROID_NDK_VERSION }}" \
            "cmdline-tools;latest"
          # 接受 license
          yes | sdkmanager --licenses || true

      - name: Set ANDROID_NDK_HOME
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV
          # gomobile 会读这些
          echo "NDK=$ANDROID_HOME/ndk/${{ env.ANDROID_NDK_VERSION }}" >> $GITHUB_ENV

      # ---------- 构建 Go AAR（含 .so） ----------
      - name: Build Go AAR with gomobile
        working-directory: go
        run: |
          go mod tidy
          # 初始化 gomobile（会用到 NDK）
          gomobile init
          mkdir -p ../app/libs
          # 只编 android，api 24+，带 mobile 标签
          gomobile bind \
            -target=android \
            -androidapi=${{ env.MIN_SDK }} \
            -tags=mobile \
            -o ../app/libs/msi.aar \
            .
          ls -lh ../app/libs/msi.aar
          # 确认 aar 里有 arm64-v8a
          unzip -l ../app/libs/msi.aar | grep -E 'arm64|armeabi|jni' || true

      # ---------- 构建 APK ----------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable (if present)
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Build Debug APK
        run: |
          # 若没有 wrapper，用系统 gradle；有则用 ./gradlew
          if [ -f gradlew ]; then
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          ls -lh "$APK"
          # 简单确认架构（debug 包通常含多 abi，或按 ndk abiFilters）
          unzip -l "$APK" | grep -E 'lib/arm|\.so' || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi-debug-apk
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 14

      - name: Upload AAR artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: msi-aar
          path: app/libs/msi.aar
          retention-days: 14
