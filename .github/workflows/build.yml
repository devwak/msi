name: Build APK (Go AAR + Android)

on:
  workflow_dispatch:          # 手动触发
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

env:
  GO_VERSION: '1.23.x'                    # 必须 ≥1.23
  JAVA_VERSION: '17'
  ANDROID_API: '35'
  ANDROID_NDK_VERSION: '26.1.10909125'    # 或改成 '27.0.12077973' / r27c 更稳
  MIN_SDK: '24'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------- Go ----------
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go/go.sum

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      # ---------- Java + Android SDK ----------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # ---------- 用专用 Action 安装 NDK（比 sdkmanager 稳定很多） ----------
      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b          # 对应 26.1.10909125
          link-to-sdk: true          # 自动链接到 $ANDROID_HOME/ndk/...

      - name: Set ANDROID_NDK_HOME
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "NDK=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          ls -la "${{ steps.setup-ndk.outputs.ndk-path }}"

      # ---------- 构建 Go AAR ----------
      - name: Build Go AAR with gomobile
        working-directory: go
        run: |
          go get -tool golang.org/x/mobile/cmd/gobind || true
          go mod tidy
          gomobile init
          mkdir -p ../app/libs
          gomobile bind \
            -target=android \
            -androidapi=${{ env.MIN_SDK }} \
            -tags=mobile \
            -o ../app/libs/msi.aar \
            .
          ls -lh ../app/libs/msi.aar
          unzip -l ../app/libs/msi.aar | grep -E 'arm64|armeabi|jni' || true

      # ---------- 后面 Gradle 编 APK 的部分保持不变 ----------

      # ---------- 构建 APK ----------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable (if present)
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; fi

      - name: Build Debug APK
        run: |
          # 若没有 wrapper，用系统 gradle；有则用 ./gradlew
          if [ -f gradlew ]; then
            ./gradlew :app:assembleDebug --no-daemon --stacktrace
          else
            gradle :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Locate APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk -name "*.apk" | head -n1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          ls -lh "$APK"
          # 简单确认架构（debug 包通常含多 abi，或按 ndk abiFilters）
          unzip -l "$APK" | grep -E 'lib/arm|\.so' || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: msi-debug-apk
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 14

      - name: Upload AAR artifact (optional)
        uses: actions/upload-artifact@v4
        with:
          name: msi-aar
          path: app/libs/msi.aar
          retention-days: 14
